<div *ngIf="isPublicRoute()">
  <router-outlet></router-outlet>
</div>

<div *ngIf="!isPublicRoute()" class="flex h-screen bg-slate-50 dark:bg-slate-900 font-inter transition-colors duration-300">
  <app-sidebar></app-sidebar>
  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- Topbar interna -->
    <header class="h-20 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between px-8 shrink-0 transition-colors duration-300">
      <div class="flex items-center bg-slate-100 dark:bg-slate-700/50 rounded-full px-4 py-2 w-96 border border-slate-200 dark:border-slate-600 focus-within:border-indigo-400 focus-within:ring-2 focus-within:ring-indigo-100 dark:focus-within:ring-indigo-500/20 transition-all">
        <span class="material-symbols-outlined text-slate-400 text-[20px] mr-2">search</span>
        <input type="text" [placeholder]="'search.placeholder' | translate" class="bg-transparent border-none outline-none w-full text-sm text-slate-700 dark:text-slate-200 placeholder-slate-400 dark:placeholder-slate-500">
      </div>
      <div class="flex items-center gap-4">
        <!-- Language Toggle -->
        <button (click)="toggleLanguage()" [title]="'lang.toggle' | translate" class="relative px-3 py-1.5 text-xs font-bold text-slate-500 dark:text-slate-400 hover:text-indigo-600 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-full transition-colors flex items-center justify-center uppercase tracking-wider">
          {{ translationService.currentLang() }}
        </button>
        <!-- Theme Toggle -->
        <button (click)="toggleTheme()" [title]="'theme.toggle' | translate" class="relative p-2 text-slate-400 hover:text-indigo-600 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-full transition-colors flex items-center justify-center">
          <span class="material-symbols-outlined text-[20px]">{{ isDarkMode ? 'light_mode' : 'dark_mode' }}</span>
        </button>
        <!-- Notifications -->
        <button class="relative p-2 text-slate-400 hover:text-indigo-600 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-full transition-colors">
          <span class="material-symbols-outlined">notifications</span>
          <span class="absolute top-2 right-2 w-2 h-2 bg-rose-500 rounded-full border border-white dark:border-slate-800"></span>
        </button>
      </div>
    </header>
    
    <!-- Area de Conteudo -->
    <main class="flex-1 overflow-x-hidden overflow-y-auto bg-slate-50/50 dark:bg-slate-900/50 p-8 transition-colors duration-300">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
