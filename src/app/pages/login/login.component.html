<div class="relative min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-white transition-colors duration-300 flex items-center justify-center overflow-hidden">
  <!-- Efeitos de fundo -->
  <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-indigo-500/20 dark:bg-indigo-600 rounded-full mix-blend-multiply filter blur-[128px] opacity-50"></div>
  <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-fuchsia-500/20 dark:bg-fuchsia-600 rounded-full mix-blend-multiply filter blur-[128px] opacity-50"></div>

  <!-- Botão de Voltar -->
  <a routerLink="/" class="absolute top-8 left-8 flex items-center gap-2 text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-white transition-colors">
    <span class="material-symbols-outlined">arrow_back</span>
    <span class="font-medium text-sm">Voltar ao portal</span>
  </a>

  <!-- Login Card -->
  <div class="relative z-10 w-full max-w-md p-4">
    <div class="glass-card rounded-[2rem] p-10 shadow-[0_8px_32px_rgba(0,0,0,0.1)] dark:shadow-[0_8px_32px_rgba(0,0,0,0.4)]">
      
      <div class="text-center mb-10">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-500/10 dark:bg-indigo-500/20 mb-6 border border-indigo-500/20 dark:border-indigo-500/30">
          <span class="material-symbols-outlined text-indigo-600 dark:text-indigo-400 text-3xl">lock</span>
        </div>
        <h2 class="text-3xl font-extrabold text-slate-900 dark:text-white">Acesso Restrito</h2>
        <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">Insira suas credenciais para gerenciar a biblioteca.</p>
      </div>

      <form class="space-y-6" (submit)="onLogin($event)">
        <!-- Email Input -->
        <div class="space-y-1">
          <label for="email" class="text-xs font-medium text-slate-600 dark:text-slate-300 ml-1 uppercase tracking-wider">Endereço de E-mail ou NUIT</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <span class="material-symbols-outlined text-slate-400 dark:text-slate-500 text-sm">mail</span>
            </div>
            <input id="email" name="email" type="text" [(ngModel)]="loginValue" required 
              class="block w-full pl-11 pr-4 py-3 bg-white/80 dark:bg-slate-900/50 border border-slate-300 dark:border-slate-700 rounded-xl text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all" 
              placeholder="105633920 ou email">
          </div>
        </div>
        
        <div *ngIf="errorMsg" class="text-rose-600 dark:text-rose-400 text-sm bg-rose-50 dark:bg-rose-900/30 p-3 rounded-lg border border-rose-200 dark:border-rose-800/50">
           {{ errorMsg }}
        </div>

        <!-- Password Input -->
        <div class="space-y-1">
          <div class="flex justify-between items-center">
            <label for="password" class="text-xs font-medium text-slate-600 dark:text-slate-300 ml-1 uppercase tracking-wider">Senha</label>
            <a href="#" class="text-xs font-medium text-indigo-600 dark:text-indigo-400 hover:text-indigo-500 dark:hover:text-indigo-300">Esqueceu?</a>
          </div>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <span class="material-symbols-outlined text-slate-400 dark:text-slate-500 text-sm">key</span>
            </div>
            <input id="password" name="password" type="password" required 
              class="block w-full pl-11 pr-4 py-3 bg-white/80 dark:bg-slate-900/50 border border-slate-300 dark:border-slate-700 rounded-xl text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all" 
              placeholder="••••••••">
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="w-full flex justify-center py-3.5 px-4 mt-8 border border-transparent rounded-xl shadow-sm text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 focus:ring-offset-slate-900 transition-all hover-scale shadow-[0_0_15px_rgba(99,102,241,0.4)]">
          AUTENTICAR
        </button>
      </form>
    </div>
  </div>
</div>
