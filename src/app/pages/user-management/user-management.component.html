<div class="mb-8 flex justify-between items-center">
  <div>
    <h1 class="text-3xl font-bold text-slate-900 dark:text-white tracking-tight font-outfit">Gestão de Utilizadores</h1>
    <p class="text-slate-500 mt-1 text-sm">Gerencie os utilizadores do sistema.</p>
  </div>
  <button *ngIf="!showForm" (click)="openNewForm()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium transition-colors">
    + Novo Utilizador
  </button>
</div>

<!-- Form -->
<div *ngIf="showForm" class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-100 dark:border-slate-700 shadow-sm p-6 mb-8">
  <h3 class="text-lg font-medium text-slate-900 dark:text-white mb-4">{{ editingId ? 'Editar Utilizador' : 'Novo Utilizador' }}</h3>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label class="block text-xs font-medium text-slate-500 mb-1 uppercase">Nome</label>
      <input type="text" [(ngModel)]="formData.firstName" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500">
    </div>
    <div>
      <label class="block text-xs font-medium text-slate-500 mb-1 uppercase">Apelido</label>
      <input type="text" [(ngModel)]="formData.lastName" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500">
    </div>
    <div>
      <label class="block text-xs font-medium text-slate-500 mb-1 uppercase">Email</label>
      <input type="email" [(ngModel)]="formData.email" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500">
    </div>
    <div>
      <label class="block text-xs font-medium text-slate-500 mb-1 uppercase">NUIT</label>
      <input type="text" [(ngModel)]="formData.taxId" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500">
    </div>
    <div class="flex items-center mt-6">
      <input type="checkbox" [(ngModel)]="formData.active" class="w-4 h-4 text-indigo-600 bg-slate-100 border-slate-300 rounded focus:ring-indigo-500">
      <label class="ml-2 text-sm font-medium text-slate-700 dark:text-slate-300">Activo</label>
    </div>
  </div>

  <div class="mt-6">
    <label class="block text-xs font-medium text-slate-500 mb-2 uppercase">Perfis Associados</label>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
      <div *ngFor="let p of availableProfiles" class="flex items-center">
        <input type="checkbox" [checked]="hasProfile(p.id)" (change)="toggleProfile(p)" class="w-4 h-4 text-indigo-600 bg-slate-100 border-slate-300 rounded focus:ring-indigo-500">
        <label class="ml-2 text-sm font-medium text-slate-700 dark:text-slate-300">{{ p.name }}</label>
      </div>
    </div>
  </div>

  <div class="mt-6 flex gap-3">
    <button (click)="saveUser()" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm font-medium transition-colors">Guardar</button>
    <button (click)="cancelForm()" class="px-5 py-2 bg-slate-200 hover:bg-slate-300 text-slate-800 rounded-lg text-sm font-medium transition-colors">Cancelar</button>
  </div>
</div>

<!-- List -->
<div *ngIf="!showForm" class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-100 dark:border-slate-700 shadow-sm overflow-hidden">
  <table class="min-w-full divide-y divide-slate-200 dark:divide-slate-700">
    <thead class="bg-slate-50 dark:bg-slate-800">
      <tr>
        <th class="px-6 py-4 text-left text-xs font-semibold text-slate-500 uppercase">Nome</th>
        <th class="px-6 py-4 text-left text-xs font-semibold text-slate-500 uppercase">Email</th>
        <th class="px-6 py-4 text-left text-xs font-semibold text-slate-500 uppercase">NUIT</th>
        <th class="px-6 py-4 text-left text-xs font-semibold text-slate-500 uppercase">Estado</th>
        <th class="px-6 py-4 text-right text-xs font-semibold text-slate-500 uppercase">Acções</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-slate-200 dark:divide-slate-700">
      <tr *ngFor="let u of users">
        <td class="px-6 py-4 text-sm text-slate-900 dark:text-white">{{ u.firstName }} {{ u.lastName }}</td>
        <td class="px-6 py-4 text-sm text-slate-500">{{ u.email }}</td>
        <td class="px-6 py-4 text-sm text-slate-500">{{ u.taxId }}</td>
        <td class="px-6 py-4 text-sm">
          <span class="px-2 py-1 text-xs rounded-full" [ngClass]="u.active ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'">
            {{ u.active ? 'Activo' : 'Inactivo' }}
          </span>
        </td>
        <td class="px-6 py-4 text-sm text-right flex justify-end gap-2">
          <button (click)="viewDetails(u)" class="px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded text-xs font-medium transition-colors" title="Ver Detalhes">
            <span class="material-symbols-outlined text-[18px]">visibility</span>
          </button>
          <button (click)="editUser(u)" class="px-2 py-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded text-xs font-medium transition-colors" title="Editar">
            <span class="material-symbols-outlined text-[18px]">edit</span>
          </button>
          <button (click)="toggleStatus(u)" [ngClass]="u.active ? 'bg-amber-50 hover:bg-amber-100 text-amber-700' : 'bg-emerald-50 hover:bg-emerald-100 text-emerald-700'" class="px-2 py-1 rounded text-xs font-medium transition-colors" [title]="u.active ? 'Inactivar' : 'Restaurar'">
            <span class="material-symbols-outlined text-[18px]">{{ u.active ? 'block' : 'settings_backup_restore' }}</span>
          </button>
        </td>
      </tr>
      <tr *ngIf="users.length === 0 && !isLoading">
        <td colspan="5" class="px-6 py-8 text-center text-slate-500">Nenhum utilizador encontrado.</td>
      </tr>
    </tbody>
  </table>
</div>
